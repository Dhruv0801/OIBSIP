<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowAuth · Client-side Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <section class="panel">
      <header class="panel-header">
        <h1>FlowAuth</h1>
        <p>Client-side login / register using localStorage.</p>
      </header>

      <section class="tabs">
        <button class="tab-btn active" data-view="login">Login</button>
        <button class="tab-btn" data-view="register">Register</button>
        <button class="tab-btn" data-view="dashboard">Dashboard</button>
      </section>

      <section class="view" id="loginView">
        <h2>Login</h2>
        <form id="loginForm" class="form">
          <div class="field">
            <label for="loginIdentity">Email or username</label>
            <input id="loginIdentity" type="text" autocomplete="username" />
          </div>
          <div class="field">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" type="password" autocomplete="current-password" />
          </div>
          <button type="submit" class="btn primary">Login</button>
          <p class="message" id="loginMessage" aria-live="polite"></p>
        </form>
      </section>

      <section class="view hidden" id="registerView">
        <h2>Register</h2>
        <form id="registerForm" class="form">
          <div class="field">
            <label for="registerIdentity">Email or username</label>
            <input id="registerIdentity" type="text" autocomplete="username" />
          </div>
          <div class="field">
            <label for="registerPassword">Password</label>
            <input id="registerPassword" type="password" autocomplete="new-password" />
          </div>
          <button type="submit" class="btn primary">Create account</button>
          <p class="message" id="registerMessage" aria-live="polite"></p>
        </form>
      </section>

      <section class="view hidden" id="dashboardView">
        <h2>Dashboard</h2>
        <p id="dashWelcome"></p>
        <p class="dash-text">
          This is a protected area. It reads the current user from localStorage.
        </p>
        <button id="logoutBtn" class="btn secondary">Logout</button>
        <p class="message" id="dashMessage" aria-live="polite"></p>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
